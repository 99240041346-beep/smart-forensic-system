name: Smart Forensic System CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forensic_ci
          POSTGRES_PASSWORD: forensic_ci
          POSTGRES_DB: smart_forensics_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forensic_ci -d smart_forensics_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Build Core Packages
        run: |
          npm run build --workspace=@smart-forensic/shared
          npm run build --workspace=@smart-forensic/security-engine
          npm run build --workspace=@smart-forensic/database
          npm run build --workspace=@smart-forensic/adb-client
          npm run build --workspace=@smart-forensic/forensic-plugins

      - name: Run Prisma Generate & DB Sync
        run: |
          cd apps/api
          npx prisma generate
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://forensic_ci:forensic_ci@localhost:5432/smart_forensics_ci?schema=public

      - name: Run Automated Security Engine Tests
        run: |
          cd apps/api
          npx tsx src/test-runner.ts
        env:
          DATABASE_URL: postgresql://forensic_ci:forensic_ci@localhost:5432/smart_forensics_ci?schema=public

      - name: Build Local Forensic Agent
        run: npm run build --workspace=@smart-forensic/local-agent

      - name: Build API Backend
        run: npm run build --workspace=@smart-forensic/api

      - name: Build Next.js Web Dashboard
        run: npm run build --workspace=@smart-forensic/web
