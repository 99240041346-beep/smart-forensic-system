services:
  # 1. Forensic API Backend & Database Service
  - type: web
    name: smart-forensic-api
    env: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build --workspace=@smart-forensic/shared && npm run build --workspace=@smart-forensic/security-engine && npm run prisma:generate && npm run build --workspace=@smart-forensic/api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: LOCAL_AGENT_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-forensic-db
          property: connectionString

  # 2. Next.js Web Forensic Dashboard
  - type: web
    name: smart-forensic-web
    env: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build --workspace=@smart-forensic/shared && npm run build --workspace=@smart-forensic/web
    startCommand: npm run start --workspace=@smart-forensic/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: smart-forensic-api
          property: host

databases:
  - name: smart-forensic-db
    plan: starter
    databaseName: smart_forensics
    user: forensic_admin
