services:
  - type: web
    name: smart-forensic-api
    env: node
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:security && npm run prisma:generate --workspace=@smart-forensic/api && npm run build:api
    startCommand: npm run start --workspace=@smart-forensic/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: LOCAL_AGENT_MODE
        value: "false"
      - key: AGENT_OFFLINE_MS
        value: "15000"
      - key: JWT_SECRET
        generateValue: true
      - key: LOCAL_AGENT_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-forensic-db
          property: connectionString

  - type: web
    name: smart-forensic-dashboard
    env: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build:shared && npm run build --workspace=@smart-forensic/web
    startCommand: npm run start --workspace=@smart-forensic/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: smart-forensic-api
          envVarKey: RENDER_EXTERNAL_URL
